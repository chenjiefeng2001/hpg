<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hpg — GLB Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 16px; left: 16px;
      background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.6; min-width: 280px;
    }
    #hud h2 { font-size: 14px; margin-bottom: 8px; color: #7ec8e3; }
    #hud .row { display: flex; justify-content: space-between; }
    #hud .label { color: #888; }
    #controls {
      position: fixed; bottom: 16px; left: 16px;
      background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px;
      font-size: 13px;
    }
    button {
      background: #2a2a4a; color: #e0e0e0; border: 1px solid #555;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: monospace;
      margin-right: 8px;
    }
    button:hover { background: #3a3a6a; }
    button.active { background: #4a6a8a; border-color: #7ec8e3; }
    #file-input { display: none; }
    #errors {
      display: none; position: fixed; bottom: 16px; right: 16px; max-width: 46ch;
      background: rgba(120, 20, 20, 0.92); border: 1px solid #f44336; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; z-index: 10;
    }
    #notices {
      display: none; position: fixed; top: 16px; right: 16px; max-width: 46ch;
      background: rgba(90, 70, 10, 0.92); border: 1px solid #d9a521; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <h2>hpg — GLB Viewer</h2>
    <div id="stats"></div>
  </div>
  <div id="controls">
    <button id="btn-direct" class="active">Direct</button>
    <button id="btn-culled">GPU Culled</button>
    <button id="btn-file">Load GLB</button>
    <input type="file" id="file-input" accept=".glb,.gltf">
    <span style="color:#888; margin-left:8px;">Drag to orbit · Scroll to zoom</span>
  </div>
  <div id="notices"></div>
  <div id="errors"></div>
  <script type="module" src="./glb-viewer.ts"></script>
</body>
</html>
