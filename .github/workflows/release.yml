name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          if [ "$lock_version" != "$package_version" ] || [ "$lock_root_version" != "$package_version" ]; then
            echo "package-lock.json version does not match package.json" >&2
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Verify asset corpus
        shell: bash
        run: |
          count="$(find benchmark/assets/models -type f -name '*.glb' | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "No GLB assets found under benchmark/assets/models" >&2
            exit 1
          fi
          echo "GLB corpus: $count files"
      - name: Real-asset audit
        run: npm run audit
      - name: Library build
        run: npm run build
      - name: Demo build
        run: npm run build:demo
      - name: Pack release
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Inspect package boundary
        shell: bash
        run: |
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "npm pack did not produce a tarball" >&2
            exit 1
          fi
          tar -tzf "$tarball" > package-files.txt
          grep -F 'package/dist/lib/index.js' package-files.txt
          grep -F 'package/dist/lib/index.d.ts' package-files.txt
          if grep -Eq '^package/(src|test|demo|benchmark)(/|$)' package-files.txt; then
            echo "Forbidden source or test content found in package" >&2
            cat package-files.txt >&2
            exit 1
          fi
      - name: Verify external consumer
        shell: bash
        run: |
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          npm run verify:package -- "$tarball"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "npm pack did not produce a tarball" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$tarball" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
